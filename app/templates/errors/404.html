{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-lg-6 text-center">
    <div class="cyber-card py-5">
      <div class="d-inline-flex p-3 rounded-circle mb-3" style="background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);">
        <i class="bi bi-compass text-cyan fs-1"></i>
      </div>
      <h1 class="h3 fw-bold text-light mb-2">404 - Endpoint Not Found</h1>
      <p class="text-muted small mb-4">
        The requested resource path does not exist on this server.
      </p>
      <div>
        <a href="{{ url_for('main.index') }}" class="btn btn-cyber-primary btn-sm">
          <i class="bi bi-house-door me-1"></i> Return to Safety
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
